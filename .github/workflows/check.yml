# Builds the package and runs all checks (`nix flake check`) on each push and
# pull request. MATLAB itself isn't involved (it can't be installed without a
# MathWorks login), so everything comes from the Nix binary cache.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run all checks
        run: nix flake check --print-build-logs
